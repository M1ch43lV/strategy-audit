<title>Strategy Ideas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f5f6f9;
  --surface:#ffffff;
  --surface-2:#eef0f4;
  --border:#dbdfe6;
  --text:#1c2029;
  --text-muted:#5b6472;
  --accent:#3552c9;
  --accent-ink:#ffffff;
  --accent-weak:#e8ecfb;
  --warn:#a8281f;
  --warn-weak:#fbe9e8;
  --code-bg:#eef0f5;
  --code-text:#333a4d;
  --shadow:0 1px 2px rgba(20,24,33,.06),0 8px 24px -12px rgba(20,24,33,.12);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151c;
    --surface:#1a1e28;
    --surface-2:#20242f;
    --border:#2b3140;
    --text:#e8eaf1;
    --text-muted:#95a0b3;
    --accent:#8ea0fb;
    --accent-ink:#12151c;
    --accent-weak:#232a44;
    --warn:#ff8a7d;
    --warn-weak:#3a2224;
    --code-bg:#1f2430;
    --code-text:#c8cee0;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151c;
  --surface:#1a1e28;
  --surface-2:#20242f;
  --border:#2b3140;
  --text:#e8eaf1;
  --text-muted:#95a0b3;
  --accent:#8ea0fb;
  --accent-ink:#12151c;
  --accent-weak:#232a44;
  --warn:#ff8a7d;
  --warn-weak:#3a2224;
  --code-bg:#1f2430;
  --code-text:#c8cee0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:15px/1.55 "IBM Plex Sans",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;font-weight:600;text-wrap:balance;margin:0}
code,.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
a{color:var(--accent)}

.app{max-width:1280px;margin:0 auto;padding:0 16px;padding-block:20px 48px}

.topbar{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 20px;
  padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:baseline;gap:10px;flex:1 1 auto;min-width:0}
.brand h1{font-size:1.5rem;letter-spacing:-.01em}
.brand .tag{color:var(--text-muted);font-size:.85rem}
.stats{display:flex;gap:14px;font-size:.82rem;color:var(--text-muted);white-space:nowrap}
.stats b{color:var(--text);font-family:"IBM Plex Mono",monospace;font-weight:600;font-variant-numeric:tabular-nums}
.ghost-btn{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  border-radius:7px;padding:7px 12px;font:500 .82rem "IBM Plex Sans",sans-serif;cursor:pointer;
  white-space:nowrap;
}
.ghost-btn:hover{border-color:var(--accent)}

.legend{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow);font-size:.88rem;color:var(--text-muted);
}
.legend p{margin:0 0 .7em}
.legend p:last-child{margin-bottom:0}
.legend strong{color:var(--text)}
.legend code{background:var(--code-bg);color:var(--code-text);padding:.05em .3em;border-radius:4px;font-size:.86em}

.layout{display:grid;grid-template-columns:270px 1fr;gap:22px;align-items:start}

.sidebar{
  position:sticky;top:20px;
  display:flex;flex-direction:column;gap:10px;
  max-height:calc(100vh - 40px);
}
.searchwrap{position:relative}
#searchBox{
  width:100%;padding:9px 12px 9px 32px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font:500 .88rem "IBM Plex Sans",sans-serif;
}
#searchBox:focus{outline:2px solid var(--accent);outline-offset:-1px}
.searchwrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}

.family-list{
  overflow-y:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface);
  box-shadow:var(--shadow);
}
.fam-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--border);
  padding:9px 12px;cursor:pointer;color:var(--text);font:500 .86rem "IBM Plex Sans",sans-serif;
}
.fam-item:last-child{border-bottom:0}
.fam-item:hover{background:var(--surface-2)}
.fam-item.active{background:var(--accent-weak);color:var(--accent);font-weight:600}
.fam-item .n{
  font:500 .74rem "IBM Plex Mono",monospace;color:var(--text-muted);background:var(--surface-2);
  border-radius:20px;padding:1px 8px;flex:0 0 auto;
}
.fam-item.active .n{background:var(--accent);color:var(--accent-ink)}
.empty-note{padding:14px 12px;color:var(--text-muted);font-size:.84rem}

.detail{min-width:0}
.fam-header{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:4px}
.fam-header h2{font-size:1.5rem}
.fam-header .count{
  font:500 .78rem "IBM Plex Mono",monospace;color:var(--text-muted);background:var(--surface-2);
  border:1px solid var(--border);border-radius:20px;padding:2px 10px;
}
.idea{
  font-size:1rem;line-height:1.65;color:var(--text);max-width:74ch;margin:10px 0 20px;
}
.idea code{background:var(--code-bg);color:var(--code-text);padding:.05em .32em;border-radius:4px;font-size:.88em}

.section{margin:24px 0}
.section > h3{font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);
  font-family:"IBM Plex Sans",sans-serif;font-weight:600;margin-bottom:10px}

.evidence-line{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:9px 13px;font-size:.86rem;color:var(--text-muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.evidence-line code{background:var(--code-bg);color:var(--code-text);padding:.05em .32em;border-radius:4px;font-size:.86em}
.held-pill{
  font:600 .72rem "IBM Plex Mono",monospace;color:#1d7a4c;background:#e4f5eb;
  border-radius:20px;padding:2px 9px;letter-spacing:.02em;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .held-pill{color:#7fe0ac;background:#163625}}
:root[data-theme="dark"] .held-pill{color:#7fe0ac;background:#163625}

.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--border);}
.timeline li{position:relative;padding:2px 0 16px 20px}
.timeline li:last-child{padding-bottom:0}
.timeline li::before{
  content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;
  background:var(--accent);border:2px solid var(--bg);
}
.timeline .ver{
  display:inline-block;font:600 .8rem "IBM Plex Mono",monospace;color:var(--accent);
  background:var(--accent-weak);border-radius:6px;padding:2px 8px;margin-bottom:5px;
}
.timeline .desc{font-size:.92rem;color:var(--text);line-height:1.55;max-width:72ch}
.timeline .desc code{background:var(--code-bg);color:var(--code-text);padding:.05em .3em;border-radius:4px;font-size:.88em}

details.rests{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:2px 14px;
}
details.rests summary{cursor:pointer;padding:10px 0;font-weight:500;color:var(--text-muted);font-size:.86rem;list-style:none}
details.rests summary::-webkit-details-marker{display:none}
details.rests summary::before{content:"▸ ";color:var(--accent)}
details.rests[open] summary::before{content:"▾ "}
details.rests ul{margin:0 0 12px;padding-left:18px;font-size:.85rem;color:var(--text-muted);line-height:1.6}
details.rests li{margin-bottom:4px}
details.rests code{background:var(--code-bg);color:var(--code-text);padding:.05em .3em;border-radius:4px;font-size:.88em}

.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface);box-shadow:var(--shadow)}
table.files{width:100%;border-collapse:collapse;font-size:.85rem;min-width:640px}
table.files th{
  text-align:left;background:var(--surface-2);color:var(--text-muted);font-weight:600;
  padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;font-size:.76rem;
  text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;
}
table.files td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top}
table.files tr:last-child td{border-bottom:0}
table.files tr:hover td{background:var(--surface-2)}
table.files code{font-size:.86em;color:var(--code-text)}
table.files td.file{color:var(--text-muted);word-break:break-all}
.datecell{white-space:nowrap;font-variant-numeric:tabular-nums}
.srcbadge{
  font:500 .68rem "IBM Plex Sans",sans-serif;color:var(--text-muted);background:var(--surface-2);
  border:1px solid var(--border);border-radius:20px;padding:1px 7px;margin-left:2px;
}
.readfrom{
  font:600 .68rem "IBM Plex Sans",sans-serif;color:var(--accent);background:var(--accent-weak);
  border-radius:20px;padding:1px 8px;margin-left:6px;white-space:nowrap;
}

.lchips{display:flex;flex-wrap:wrap;gap:5px;padding:8px 10px;border-bottom:1px solid var(--border)}
.lchip{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:20px;padding:2px 9px;font:500 .72rem "IBM Plex Sans",sans-serif;cursor:pointer}
.lchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lab{display:inline-block;font:600 .68rem "IBM Plex Sans",sans-serif;color:var(--accent);background:var(--accent-weak);border-radius:20px;padding:1px 8px;margin:2px 4px 0 0}
.lab.v{color:var(--text-muted);background:var(--surface-2);border:1px dashed var(--text-muted)}
.fam-item .ls{display:block;font:500 .66rem "IBM Plex Sans",sans-serif;color:var(--text-muted);font-weight:500}
.nodesc{color:var(--text-muted);font-style:italic}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:static;max-height:none}
  .family-list{max-height:280px}
}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
</style>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <h1>Strategy Ideas</h1>
      <span class="tag">a corpus of Freqtrade strategy families</span>
    </div>
    <div class="stats"><span><b id="statFamilies">–</b> families</span><span><b id="statFiles">–</b> strategy files</span></div>
    <button class="ghost-btn" id="legendToggle" type="button">About this page</button>
  </div>

  <div class="legend" id="legendPanel" hidden></div>

  <div class="layout">
    <aside class="sidebar">
      <div class="searchwrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
        <input id="searchBox" type="text" placeholder="Filter families…" autocomplete="off">
      </div>
      <div class="lchips" id="lchips"></div>
      <div class="family-list" id="familyList"></div>
    </aside>
    <main class="detail" id="detail"></main>
  </div>
</div>

<script>
(function(){
  var DATA = null, currentFamily = null, LF = {};

  function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }

  function escAttr(s){ return String(s).replace(/"/g,'&quot;'); }

  function markReadFrom(cellHtml){
    // cellHtml like: <code>Name</code> *
    var m = cellHtml.match(/^(.*<\/code>)\s*\*\s*$/);
    if(m){
      return m[1] + ' <span class="readfrom">read from</span>';
    }
    return cellHtml;
  }

  function renderLegend(){
    var el = document.getElementById('legendPanel');
    el.innerHTML = DATA.intro_paras.map(function(p){ return '<p>'+p+'</p>'; }).join('');
  }

  function renderFamilyList(filter){
    var list = document.getElementById('familyList');
    var q = (filter||'').trim().toLowerCase();
    var items = DATA.families.filter(function(f){
      for(var k in LF){ if(LF[k] && (f.labels||[]).indexOf(k) < 0) return false; }
      if(!q) return true;
      if(f.name.toLowerCase().indexOf(q) !== -1) return true;
      return f.file_rows.some(function(row){
        return row.some(function(cell){ return String(cell).toLowerCase().indexOf(q) !== -1; });
      });
    });
    if(items.length === 0){
      list.innerHTML = '<div class="empty-note">No family matches “'+q+'”.</div>';
      return;
    }
    list.innerHTML = items.map(function(f){
      var active = currentFamily && currentFamily.name === f.name ? ' active' : '';
      return '<button class="fam-item'+active+'" data-slug="'+slugify(f.name)+'" title="'+escAttr(f.name)+'">'
        + '<span>'+f.name+'<span class="ls">'+((f.labels||[]).join(' · ')||'no majority label')+'</span></span><span class="n">'+f.count+'</span></button>';
    }).join('');
    Array.prototype.forEach.call(list.querySelectorAll('.fam-item'), function(btn){
      btn.addEventListener('click', function(){
        var fam = DATA.families.find(function(f){ return slugify(f.name) === btn.dataset.slug; });
        if(fam) selectFamily(fam, true);
      });
    });
  }

  function renderDetail(fam){
    var d = document.getElementById('detail');
    var html = '';
    html += '<div class="fam-header"><h2>'+fam.name+'</h2><span class="count">'+fam.count+' strateg'+(fam.count===1?'y':'ies')+' in the corpus</span></div>';
    html += '<div>'+(fam.labels||[]).map(function(l){return '<span class="lab">'+l+'</span>';}).join('')
      + Object.keys(fam.variant_labels||{}).map(function(l){return '<span class="lab v" title="carried by a minority of members">'+l+' '+fam.variant_labels[l]+'/'+fam.count+'</span>';}).join('')
      + '</div>';
    html += fam.idea_html ? '<div class="idea">'+fam.idea_html+'</div>' : '<p class="nodesc">No written description for this family yet; the members and their labels are listed below.</p>';
    (fam.other_descriptions||[]).forEach(function(o){ html += '<div class="idea"><b>'+o.stem+'</b>: '+o.idea_html+'</div>'; });

    if(fam.version_rows && fam.version_rows.length){
      html += '<div class="section"><h3>Version history</h3><ul class="timeline">';
      fam.version_rows.forEach(function(row){
        html += '<li><span class="ver">'+row[0]+'</span><div class="desc">'+row[1]+'</div></li>';
      });
      html += '</ul></div>';
    }

    if(fam.read_from_html){
      html += '<div class="section"><h3>Evidence</h3><div class="evidence-line">'+fam.read_from_html+'</div></div>';
    }

    if(fam.details_items && fam.details_items.length){
      html += '<div class="section"><details class="rests"><summary>What this reading rests on</summary><ul>'
        + fam.details_items.map(function(li){ return '<li>'+li+'</li>'; }).join('')
        + '</ul></details></div>';
    }

    if(fam.file_rows && fam.file_rows.length){
      html += '<div class="section"><h3>Files in the corpus</h3><div class="tablewrap"><table class="files"><thead><tr>'
        + (fam.file_headers||[]).map(function(h){ return '<th>'+h+'</th>'; }).join('')
        + '</tr></thead><tbody>';
      fam.file_rows.forEach(function(row){
        html += '<tr>';
        row.forEach(function(cell, i){
          var cls = '';
          if(i === 1) cls = ' class="datecell"';
          if(i === row.length - 1) cls = ' class="file"';
          var content = i === 0 ? markReadFrom(cell) : cell;
          html += '<td'+cls+'>'+content+'</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table></div></div>';
    }

    d.innerHTML = html;
  }

  function selectFamily(fam, updateHash){
    currentFamily = fam;
    renderDetail(fam);
    renderFamilyList(document.getElementById('searchBox').value);
    if(updateHash){
      try{ history.replaceState(null, '', '#'+slugify(fam.name)); }catch(e){}
    }
  }

  function init(){
    document.getElementById('statFamilies').textContent = DATA.families.length;
    document.getElementById('statFiles').textContent = DATA.families.reduce(function(s,f){ return s + f.count; }, 0);
    renderLegend();
    var lc = document.getElementById('lchips');
    lc.innerHTML = (DATA.labels||[]).map(function(l){return '<button type="button" class="lchip" aria-pressed="false" data-l="'+l+'">'+l+'</button>';}).join('');
    Array.prototype.forEach.call(lc.querySelectorAll('.lchip'), function(b){
      b.addEventListener('click', function(){
        LF[b.dataset.l] = !LF[b.dataset.l]; b.setAttribute('aria-pressed', LF[b.dataset.l]);
        renderFamilyList(document.getElementById('searchBox').value);
      });
    });

    var byCount = DATA.families.slice().sort(function(a,b){ return b.count - a.count; });
    DATA.families = byCount;

    renderFamilyList('');

    document.getElementById('searchBox').addEventListener('input', function(e){
      renderFamilyList(e.target.value);
    });

    document.getElementById('legendToggle').addEventListener('click', function(){
      var el = document.getElementById('legendPanel');
      el.hidden = !el.hidden;
      this.textContent = el.hidden ? 'About this page' : 'Hide';
    });

    var hash = (location.hash||'').replace('#','');
    var initial = null;
    if(hash){
      initial = DATA.families.find(function(f){ return slugify(f.name) === hash; });
    }
    if(!initial) initial = DATA.families[0];
    selectFamily(initial, false);
  }

  fetch('data.json').then(function(r){ return r.json(); }).then(function(json){
    DATA = json;
    init();
  }).catch(function(err){
    document.getElementById('detail').innerHTML = '<p style="color:var(--warn)">Could not load data.json: '+err+'</p>';
  });
})();
</script>
